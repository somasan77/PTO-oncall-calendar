  <!-- 単一HTML完結型 PWA Manifest & アイコン自動生成 -->
  <script>
    (function setupSingleFilePWA() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 192;
        canvas.height = 192;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#4f46e5';
        ctx.beginPath();
        ctx.roundRect(0, 0, 192, 192, 42);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 54px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('有給', 96, 70);
        ctx.font = 'bold 44px sans-serif';
        ctx.fillText('＆OC', 96, 132);
        const iconUrl = canvas.toDataURL('image/png');

        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        const manifest = {
          name: '有給＆オンコール管理',
          short_name: '有給＆OC',
          start_url: './',
          display: 'standalone',
          background_color: '#f8fafc',
          theme_color: '#4f46e5',
          icons: [{ src: iconUrl, sizes: '192x192', type: 'image/png' }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(blob);
        document.head.appendChild(manifestLink);
      } catch (e) {}
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 埋め込み済みFirebase設定
    const CUSTOM_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBBTIFpAPLK61wD6AyGWXghsbWhFAo_N2M",
      authDomain: "pto-oncall-calendar.firebaseapp.com",

      measurementId: "G-VP408MM637"
    };

    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

    const DEFAULT_MEMBERS = [
      { id: 'm1', name: '佐藤', active: true, workDays: [1, 2, 3, 4, 5] },
      { id: 'm2', name: '鈴木', active: true, workDays: [1, 2, 3, 4, 5] },

    // 配慮・除外ルール定義（連直を削除し、同一週内回避を含む4項目）
    const RULE_CATALOG = {
      excludePmLeave: {

        desc: '午後に休暇がある日を優先的に避けます'

        desc: '翌日が全休のメンバーを前日当番から避けます'

      excludeAmLeave: {

      }

    const DEFAULT_RULE_ITEMS = [
      { id: 'excludePmLeave', enabled: true },
      { id: 'avoidSameWeekMultiple', enabled: true },
      { id: 'avoidBeforeFullLeave', enabled: true },
      { id: 'excludeAmLeave', enabled: false },
    ];

    // 優先順位に応じたペナルティ重み（1位ほど絶対回避に近い強力なペナルティ）
    const PRIORITY_WEIGHTS = [1200, 800, 500, 250];

    function normalizeRuleItems(rawRules) {
      if (Array.isArray(rawRules)) {
        const valid = rawRules.filter(r => r && RULE_CATALOG[r.id]);
        DEFAULT_RULE_ITEMS.forEach(def => {
          if (!valid.some(v => v.id === def.id)) valid.push(def);
        });
        return valid;
      }
      if (rawRules && typeof rawRules === 'object') {
        return DEFAULT_RULE_ITEMS.map(def => ({
          id: def.id,
          enabled: rawRules[def.id] !== undefined ? !!rawRules[def.id] : def.enabled
        }));
      }
      return DEFAULT_RULE_ITEMS;
    }

    // 日本の祝日自動算出エンジン（何年先でもオフラインで正確に算出＋API取得のフォールバック）
    function computeJapaneseHolidaysForYear(y) {
      const map = {};
      const pad = (n) => String(n).padStart(2, '0');
      const setH = (m, d, name) => { map[`${y}-${pad(m)}-${pad(d)}`] = name; };
      const nthMonday = (m, nth) => {
        const firstDow = new Date(y, m - 1, 1).getDay();
        const firstMon = 1 + ((8 - firstDow) % 7);
        return firstMon + (nth - 1) * 7;
      };

      setH(1, 1, '元日');
      setH(1, nthMonday(1, 2), '成人の日');
      setH(2, 11, '建国記念の日');
      setH(2, 23, '天皇誕生日');
      const vernal = Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
      setH(3, vernal, '春分の日');
      setH(4, 29, '昭和の日');
      setH(5, 3, '憲法記念日');
      setH(5, 4, 'みどりの日');
      setH(5, 5, 'こどもの日');
      setH(7, nthMonday(7, 3), '海の日');
      setH(8, 11, '山の日');
      setH(9, nthMonday(9, 3), '敬老の日');
      const autumnal = Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
      setH(9, autumnal, '秋分の日');
      setH(10, nthMonday(10, 2), 'スポーツの日');
      setH(11, 3, '文化の日');
      setH(11, 23, '勤労感謝の日');

      // 国民の休日（敬老の日と秋分の日に挟まれた平日）
      for (let d = 15; d <= 25; d++) {
        const kPrev = `${y}-09-${pad(d - 1)}`;
        const kCurr = `${y}-09-${pad(d)}`;
        const kNext = `${y}-09-${pad(d + 1)}`;
        if (map[kPrev] && !map[kCurr] && map[kNext] && new Date(y, 8, d).getDay() !== 0) {
          map[kCurr] = '国民の休日';
        }
      }

      // 振替休日（日曜が祝日の場合、直後の祝日でない日を振替休日にする）
      const baseKeys = Object.keys(map).sort();
      baseKeys.forEach(k => {
        const [yy, mm, dd] = k.split('-').map(Number);
        const dt = new Date(yy, mm - 1, dd);
        if (dt.getDay() === 0) {
          let nextDt = new Date(yy, mm - 1, dd + 1);
          while (true) {
            const nk = `${nextDt.getFullYear()}-${pad(nextDt.getMonth() + 1)}-${pad(nextDt.getDate())}`;
            if (!map[nk]) {
              map[nk] = '振替休日';
              break;
            }
            nextDt.setDate(nextDt.getDate() + 1);
          }
        }
      });

      return map;
    }

    const LEAVE_TYPES = [
      { id: 'full', label: '全日有休', short: '全休', band: 'full', bg: 'bg-rose-300/80', badge: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'am', label: '午前休', short: '午前休', band: 'left-half', bg: 'bg-amber-300/80', badge: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'pm', label: '午後休', short: '午後休', band: 'right-half', bg: 'bg-orange-300/80', badge: 'bg-orange-100 text-orange-800 border-orange-300' },
      { id: 'am_1h', label: '午前1時間休', short: '前1h', band: 'left-short', bg: 'bg-sky-300/80', badge: 'bg-sky-100 text-sky-800 border-sky-300' },
      { id: 'am_2h', label: '午前2時間休', short: '前2h', band: 'left-short', bg: 'bg-sky-300/80', badge: 'bg-sky-100 text-sky-800 border-sky-300' },
      { id: 'am_3h', label: '午前3時間休', short: '前3h', band: 'left-short', bg: 'bg-sky-300/80', badge: 'bg-sky-100 text-sky-800 border-sky-300' },
      { id: 'pm_1h', label: '午後1時間休', short: '後1h', band: 'right-short', bg: 'bg-teal-300/80', badge: 'bg-teal-100 text-teal-800 border-teal-300' },
      { id: 'pm_2h', label: '午後2時間休', short: '後2h', band: 'right-short', bg: 'bg-teal-300/80', badge: 'bg-teal-100 text-teal-800 border-teal-300' },
      { id: 'pm_3h', label: '午後3時間休', short: '後3h', band: 'right-short', bg: 'bg-teal-300/80', badge: 'bg-teal-100 text-teal-800 border-teal-300' },
      { id: 'ng', label: 'オンコール不可(定時)', short: '定時', band: 'none', bg: '', badge: 'bg-slate-100 text-slate-700 border-slate-300' },
    ];

    function parseFirebaseConfigInput(rawText) {
      if (!rawText || !rawText.trim()) return null;
      try {
        return JSON.parse(rawText);
      } catch (e) {
        try {
          const match = rawText.match(/\{[\s\S]*\}/);
          if (!match) return null;
          return Function('"use strict";return (' + match[0] + ')')();
        } catch (err) {
          return null;
        }
      }
    }

    function App() {
      const [activeTab, setActiveTab] = useState('leave'); // 'leave' | 'oncall' | 'settings'
      const [settingsSubTab, setSettingsSubTab] = useState('auto'); // 'auto' | 'member' | 'cloud'
      const [currentDate, setCurrentDate] = useState(new Date(2026, 10, 1));
      const [slideAnim, setSlideAnim] = useState({ dir: '', seq: 0 });
      const [toastMsg, setToastMsg] = useState(null);

      // 祝日データ（自動計算＋API自動取得）
      const [apiHolidays, setApiHolidays] = useState(() => {
        try {
          const cached = localStorage.getItem('oncall_holidays_api_cache');
          return cached ? JSON.parse(cached) : {};
        } catch (e) {
          return {};
        }
      });

      useEffect(() => {
        fetch('https://holidays-jp.github.io/api/v1/date.json')
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && typeof data === 'object') {
              setApiHolidays(data);
              localStorage.setItem('oncall_holidays_api_cache', JSON.stringify(data));
            }
          })
          .catch(() => {});
      }, []);

      const [members, setMembers] = useState(() => {
        const saved = localStorage.getItem('oncall_members_v3');
        return saved ? JSON.parse(saved) : DEFAULT_MEMBERS;
      });
      const [leaves, setLeaves] = useState(() => {
        const saved = localStorage.getItem('oncall_leaves_v3');
        return saved ? JSON.parse(saved) : {};
      });
      const [oncalls, setOncalls] = useState(() => {
        const saved = localStorage.getItem('oncall_assign_v3');
        return saved ? JSON.parse(saved) : {};
      });
      const [targetDays, setTargetDays] = useState(() => {
        const saved = localStorage.getItem('oncall_target_days_v3');
        return saved ? JSON.parse(saved) : [1, 2, 3, 4, 5];
      });
      const [ruleItems, setRuleItems] = useState(() => {
        const saved = localStorage.getItem('oncall_rule_items_v4');
        if (saved) return normalizeRuleItems(JSON.parse(saved));
        const legacy = localStorage.getItem('oncall_rules_v3');
        return legacy ? normalizeRuleItems(JSON.parse(legacy)) : DEFAULT_RULE_ITEMS;
      });

      // ドラッグ＆ドロップ並び替え用ステート
      const [draggingRuleIdx, setDraggingRuleIdx] = useState(null);

      // クラウド同期状態
      const [syncStatus, setSyncStatus] = useState('init');
      const [syncErrorDetail, setSyncErrorDetail] = useState('');
      const [customConfigText, setCustomConfigText] = useState(() => localStorage.getItem('oncall_firebase_config_raw') || '');
      const docRefHolder = useRef(null);

      const [selectedDateKey, setSelectedDateKey] = useState(null);
      const [formMemberId, setFormMemberId] = useState('m1');
      const [formLeaveType, setFormLeaveType] = useState('full');

      const touchStartX = useRef(null);
      const touchStartY = useRef(null);
      const didSwipeRef = useRef(false);

      useEffect(() => { localStorage.setItem('oncall_members_v3', JSON.stringify(members)); }, [members]);
      useEffect(() => { localStorage.setItem('oncall_leaves_v3', JSON.stringify(leaves)); }, [leaves]);
      useEffect(() => { localStorage.setItem('oncall_assign_v3', JSON.stringify(oncalls)); }, [oncalls]);
      useEffect(() => { localStorage.setItem('oncall_target_days_v3', JSON.stringify(targetDays)); }, [targetDays]);
      useEffect(() => { localStorage.setItem('oncall_rule_items_v4', JSON.stringify(ruleItems)); }, [ruleItems]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 2200);
      };

      // Firebase Firestore リアルタイム同期
      useEffect(() => {
        let unsubscribeSnapshot = null;
        let unsubscribeAuth = null;

        async function initCloudSync() {
          try {
            let fbConfig = null;
            const savedRaw = localStorage.getItem('oncall_firebase_config_raw');
            if (savedRaw) fbConfig = parseFirebaseConfigInput(savedRaw);
            if (!fbConfig && CUSTOM_FIREBASE_CONFIG) fbConfig = CUSTOM_FIREBASE_CONFIG;
            if (!fbConfig && typeof __firebase_config !== 'undefined' && __firebase_config) {
              fbConfig = JSON.parse(__firebase_config);
            }

            if (!fbConfig || !fbConfig.apiKey) {
              setSyncStatus('local');
              return;
            }

            const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(fbConfig);
            const auth = firebase.auth(app);
            const db = firebase.firestore(app);

            await auth.signInAnonymously();

            unsubscribeAuth = auth.onAuthStateChanged((user) => {
              if (!user) return;
              const sharedDocRef = db.collection('calendars').doc('shared_main');
              docRefHolder.current = sharedDocRef;

              unsubscribeSnapshot = sharedDocRef.onSnapshot(
                (snapshot) => {
                  setSyncStatus('connected');
                  setSyncErrorDetail('');
                  if (snapshot.exists) {
                    const data = snapshot.data();
                    if (data.members) setMembers(data.members);
                    if (data.leaves) setLeaves(data.leaves);
                    if (data.oncalls) setOncalls(data.oncalls);
                    if (data.targetDays) setTargetDays(data.targetDays);
                    if (data.ruleItems) {
                      setRuleItems(normalizeRuleItems(data.ruleItems));
                    } else if (data.rules) {
                      setRuleItems(normalizeRuleItems(data.rules));
                    }
                  } else {
                    sharedDocRef.set({
                      members,
                      leaves,
                      oncalls,
                      targetDays,
                      ruleItems,
                      updatedAt: Date.now()
                    }, { merge: true }).catch(() => {});
                  }
                },
                (err) => {
                  console.error('Firestore sync error:', err);
                  setSyncStatus('error');
                  setSyncErrorDetail(err.message || '権限またはネットワークエラー');
                }
              );
            });
          } catch (err) {
            console.error('Firebase init error:', err);
            setSyncStatus('error');
            setSyncErrorDetail(err.message || 'Firebase初期化エラー');
          }
        }

        initCloudSync();
        return () => {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          if (unsubscribeAuth) unsubscribeAuth();
        };
      }, []);

      const pushToCloud = (patch) => {
        if (!docRefHolder.current) return;
        docRefHolder.current.set({
          ...patch,
          updatedAt: Date.now()
        }, { merge: true }).catch((err) => {
          console.error('Cloud write error:', err);
        });
      };

      const updateMembers = (updater) => {
        setMembers(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          pushToCloud({ members: next });
          return next;
        });
      };

      const updateLeaves = (updater) => {
        setLeaves(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          pushToCloud({ leaves: next });
          return next;
        });
      };

      const updateOncalls = (updater) => {
        setOncalls(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          pushToCloud({ oncalls: next });
          return next;
        });
      };

      const updateTargetDays = (updater) => {
        setTargetDays(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          pushToCloud({ targetDays: next });
          return next;
        });
      };

      const updateRuleItems = (updater) => {
        setRuleItems(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          pushToCloud({ ruleItems: next });
          return next;
        });
      };

      // ルールの順序入れ替えヘルパー
      const moveRuleItem = (fromIdx, toIdx) => {
        if (toIdx < 0 || toIdx >= ruleItems.length || fromIdx === toIdx) return;
        updateRuleItems(prev => {
          const copy = [...prev];
          const [moved] = copy.splice(fromIdx, 1);
          copy.splice(toIdx, 0, moved);
          return copy;
        });
      };

      // スマホのタッチドラッグ並び替えハンドラー
      const handleRuleTouchMove = (e) => {
        if (draggingRuleIdx === null) return;
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const row = el?.closest('[data-rule-index]');
        if (row) {
          const targetIdx = Number(row.getAttribute('data-rule-index'));
          if (!Number.isNaN(targetIdx) && targetIdx !== draggingRuleIdx) {
            moveRuleItem(draggingRuleIdx, targetIdx);
            setDraggingRuleIdx(targetIdx);
          }
        }
      };

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const changeMonth = (delta) => {
        setSlideAnim(prev => ({
          dir: delta > 0 ? 'next' : 'prev',
          seq: prev.seq + 1
        }));
        setCurrentDate(new Date(year, month + delta, 1));
      };

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
        didSwipeRef.current = false;
      };

      const handleTouchEnd = (e) => {
        if (touchStartX.current === null || touchStartY.current === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX.current;
        const dy = e.changedTouches[0].clientY - touchStartY.current;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          didSwipeRef.current = true;
          if (dx < 0) changeMonth(1);
          else changeMonth(-1);
        }
        touchStartX.current = null;
        touchStartY.current = null;
      };

      const handleMouseDown = (e) => {
        touchStartX.current = e.clientX;
        touchStartY.current = e.clientY;
        didSwipeRef.current = false;
      };

      const handleMouseUp = (e) => {
        if (touchStartX.current === null || touchStartY.current === null) return;
        const dx = e.clientX - touchStartX.current;
        const dy = e.clientY - touchStartY.current;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          didSwipeRef.current = true;
          if (dx < 0) changeMonth(1);
          else changeMonth(-1);
        }
        touchStartX.current = null;
        touchStartY.current = null;
      };

      // 表示中の年の祝日マップ（自動計算＋Web APIデータの統合）
      const holidaysForYear = useMemo(() => {
        const computed = computeJapaneseHolidaysForYear(year);
        return { ...computed, ...apiHolidays };
      }, [year, apiHolidays]);

      const calendarCells = useMemo(() => {
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startOffset = firstDay.getDay();
        const totalDays = lastDay.getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= totalDays; d++) {
          const mm = String(month + 1).padStart(2, '0');
          const dd = String(d).padStart(2, '0');
          const key = `${year}-${mm}-${dd}`;
